# Render terminates HTTPS; PORT is provided by Render, default usable locally.
server.port=${PORT:8080}
server.address=0.0.0.0
app.storage.mode=database
app.upload-dir=${java.io.tmpdir}/san-nha-image-cache
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=34MB
server.tomcat.threads.max=30

# Gemini settings are optional and inherited from application.properties.
# Empty/invalid GEMINI_MODEL or GEMINI_API_KEY disables only AI, never website startup.

# Runtime DML account is separate from optional deployment-only Flyway credentials.
spring.flyway.enabled=${RUN_DB_MIGRATIONS:false}
spring.flyway.user=${MIGRATION_DB_USERNAME:}
spring.flyway.password=${MIGRATION_DB_PASSWORD:}
