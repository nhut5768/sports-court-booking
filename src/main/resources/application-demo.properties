# Chỉ dùng xem giao diện/nghiệp vụ local. H2 trong RAM — tắt app là mất dữ liệu.
# Tách khỏi cấu hình MySQL (profile mặc định). Không dùng cho triển khai thật.
spring.datasource.url=jdbc:h2:mem:courtdemo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.demo.seed=true
app.upload-dir=${java.io.tmpdir}/san-nha-demo-uploads
