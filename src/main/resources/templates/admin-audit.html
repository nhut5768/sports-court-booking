<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Nhật ký quản trị')}"></head><body><header th:replace="~{fragments :: siteHeader}"></header><main id="main-content" tabindex="-1" class="container page-space admin-shell"><nav th:replace="~{admin-nav :: menu}"></nav><div th:replace="~{fragments :: flash}"></div>
<section class="admin-heading"><p class="eyebrow text-green">THEO DÕI THAO TÁC</p><h1>Nhật ký quản trị.</h1><p>Lưu người thực hiện, tài khoản đích và thay đổi quyền. Không ghi mật khẩu, hash hoặc khóa API.</p></section>
<section class="admin-card"><div class="table-responsive"><table class="table admin-table"><thead><tr><th>Thời gian</th><th>Admin ID</th><th>Tài khoản ID</th><th>Hành động</th><th>Chi tiết</th></tr></thead><tbody><tr th:each="event:${journal}"><td th:text="${#temporals.format(event.createdAt,'dd/MM/yyyy HH:mm:ss')}"></td><td th:text="${event.actorId}"></td><td><a th:href="@{/admin/accounts/{id}(id=${event.targetId})}" th:text="|#${event.targetId}|"></a></td><td th:text="${actionLabels[event.action] ?: event.action}"></td><td th:text="${event.detail}"></td></tr><tr th:if="${journal.empty}"><td colspan="5" class="admin-empty">Chưa có thao tác quản trị.</td></tr></tbody></table></div>
<nav class="pager" th:if="${journal.totalPages>1}" aria-label="Phân trang nhật ký"><a th:if="${journal.hasPrevious()}" th:href="@{/admin/audit(page=${journal.number-1})}">Trang trước</a><span th:text="|Trang ${journal.number+1} / ${journal.totalPages}|"></span><a th:if="${journal.hasNext()}" th:href="@{/admin/audit(page=${journal.number+1})}">Trang sau</a></nav></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
