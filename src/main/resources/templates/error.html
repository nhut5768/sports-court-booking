<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Không thể thực hiện')}"></head>
<body>
<header th:replace="~{fragments :: siteHeader}"></header>
<main id="main-content" tabindex="-1" class="container page-space">
  <section class="surface">
    <p class="eyebrow text-green">VUI LÒNG KIỂM TRA LẠI</p>
    <h1>Chưa thể thực hiện yêu cầu</h1>
    <p th:text="${message!=null?message:'Đường dẫn không tồn tại hoặc yêu cầu không hợp lệ. Vui lòng quay lại và thử lại.'}"></p>
    <div th:replace="~{fragments :: pager(${page}, '/')}"></div>
    <a class="btn btn-primary" th:href="@{/}">Về trang tìm sân</a>
  </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
