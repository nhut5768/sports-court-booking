<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đổi mật khẩu')}"></head>
<body>
<header th:replace="~{fragments :: siteHeader}"></header>

<main id="main-content" tabindex="-1" class="container page-space">
  <section class="surface password-card" aria-labelledby="password-title">
    <a class="login-back" th:if="${!forced}" th:href="@{/account}">← Quay lại tài khoản</a>

    <p class="eyebrow text-green mt-3">BẢO MẬT TÀI KHOẢN</p>
    <h1 id="password-title" class="h2">Đổi mật khẩu</h1>

    <p class="deposit-warning" th:if="${forced}">
      Bạn đang đăng nhập bằng mật khẩu tạm do chủ sân cấp.
      Hãy đặt mật khẩu mới để tiếp tục sử dụng.
    </p>

    <div th:replace="~{fragments :: flash}"></div>

    <form th:action="@{/account/password}" method="post">
      <div class="mb-3">
        <label for="current" class="form-label"
               th:text="${forced ? 'Mật khẩu tạm' : 'Mật khẩu hiện tại'}">Mật khẩu hiện tại</label>
        <input id="current"
               name="current"
               type="password"
               class="form-control"
               autocomplete="current-password"
               required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Mật khẩu mới</label>
        <input id="password"
               name="password"
               type="password"
               class="form-control"
               minlength="8"
               maxlength="64"
               autocomplete="new-password"
               required>
        <small class="register-field-help">Sử dụng từ 8 đến 64 ký tự.</small>
      </div>

      <div class="mb-4">
        <label for="confirm" class="form-label">Nhập lại mật khẩu mới</label>
        <input id="confirm"
               name="confirm"
               type="password"
               class="form-control"
               minlength="8"
               maxlength="64"
               autocomplete="new-password"
               required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Lưu mật khẩu mới</button>
    </form>
  </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
