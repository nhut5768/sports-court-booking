<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Chi tiết tài khoản')}"></head><body class="sn-app sn-admin-account"><header th:replace="~{fragments :: siteHeader}"></header><main id="main-content" tabindex="-1" class="container page-space admin-shell"><nav th:replace="~{admin-nav :: menu}"></nav><div th:replace="~{fragments :: flash}"></div>
<section class="admin-heading"><p class="eyebrow text-green" th:text="|TÀI KHOẢN #${entry.id}|"></p><h1 th:text="${entry.name}"></h1><p>Cập nhật thông tin hoặc khóa tài khoản sẽ thu hồi các phiên đăng nhập cũ.</p></section>
<section th:replace="~{fragments :: workspaceArt('admin', 'Vận hành vững vàng', 'Theo dõi tài khoản, quyền truy cập và hoạt động trên nền tảng Sân Nhà.')}"></section>

<div class="admin-grid"><section class="admin-card"><h2>Thông tin tài khoản</h2>
<dl class="admin-facts"><dt>Vai trò</dt><dd th:text="${entry.role}"></dd><dt>Trạng thái</dt><dd th:text="${entry.locked?'Bị khóa':'Hoạt động'}"></dd><dt>Đăng nhập Google</dt><dd th:text="${entry.google?'Đã liên kết':'Chưa liên kết'}"></dd><dt>Ngày tạo</dt><dd th:text="${#temporals.format(entry.createdAt,'dd/MM/yyyy HH:mm')}"></dd></dl>
<form class="admin-form" method="post" th:action="@{/admin/accounts/{id}/profile(id=${entry.id})}">
<label for="edit-name">Họ và tên</label><input id="edit-name" class="form-control" name="name" th:value="${entry.name}" required minlength="2" maxlength="100">
<label for="edit-email">Email</label><input id="edit-email" class="form-control" name="email" type="email" th:value="${entry.email}" th:readonly="${entry.google}" required maxlength="190">
<label for="edit-phone">Số điện thoại</label><input id="edit-phone" class="form-control" name="phone" type="tel" th:value="${entry.phone}" maxlength="20"><button class="btn btn-success" type="submit">Lưu thông tin</button></form></section>
<div class="admin-side"><section class="admin-card"><h2 th:text="${entry.locked?'Mở lại tài khoản':'Khóa tài khoản'}"></h2><p>Khóa quyền đăng nhập và thu hồi phiên; giữ nguyên sân, đơn đặt và hội thoại. Không thể tự khóa quản trị viên đang đăng nhập; luôn giữ một admin hoạt động.</p>
<form method="post" th:action="@{/admin/accounts/{id}/lock(id=${entry.id})}"><input type="hidden" name="locked" th:value="${!entry.locked}"><button class="btn" th:classappend="${entry.locked?'btn-success':'btn-outline-danger'}" type="submit" th:text="${entry.locked?'Mở khóa':'Khóa tài khoản'}"></button></form></section></div></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
