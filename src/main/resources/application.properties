spring.application.name=sports-court-booking
spring.profiles.default=mysql

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.flyway.enabled=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

spring.thymeleaf.cache=false

# Tối đa 10 MB mỗi ảnh, 85 MB cho toàn bộ một lần gửi
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=85MB

app.demo.seed=false
app.upload-dir=${UPLOAD_DIR:./uploads}
# AI server credentials only; shared by mysql/demo/prod profiles.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:}
